<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src https://app.example/edit-frame.html; base-uri 'none'; form-action 'none'">
<title>HTML-Schuleditor</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<svg id="icons" xmlns="http://www.w3.org/2000/svg" hidden>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></symbol>
  <symbol id="i-file-new" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></symbol>
  <symbol id="i-file-open" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></symbol>
  <symbol id="i-save-as" viewBox="0 0 24 24"><path d="M12 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9l3 3v4"/><path d="M8 3v5h6V3"/><path d="M14.5 20.5 15 18l4.5-4.5a1.4 1.4 0 0 1 2 2L17 20z"/></symbol>
  <symbol id="i-browser" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.5 5.6 3.5 9s-1 6.4-3.5 9c-2.5-2.6-3.5-5.6-3.5-9s1-6.4 3.5-9"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3.5 9.5h6M3.5 9.5v-6"/><path d="M3.8 9.3A8.5 8.5 0 0 1 20 13.5"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20.5 9.5h-6M20.5 9.5v-6"/><path d="M20.2 9.3A8.5 8.5 0 0 0 4 13.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9.5" r="1.8"/><path d="m4 18 5-5 3.5 3.5L15 14l5 5"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7L11.5 6.8"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5"/></symbol>
  <symbol id="i-unlink" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7L11.5 6.8"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5"/><path d="M4 4l16 16"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
  <symbol id="i-numbers" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 4.5l1.5-.5V8M4 8h3M4 11h2.5a1 1 0 0 1 .4 1.9L4 15h3"/></symbol>
  <symbol id="i-align-left" viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></symbol>
  <symbol id="i-align-center" viewBox="0 0 24 24"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></symbol>
  <symbol id="i-align-right" viewBox="0 0 24 24"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></symbol>
  <symbol id="i-align-justify" viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></symbol>
  <symbol id="i-break" viewBox="0 0 24 24"><path d="M19 5v7a3 3 0 0 1-3 3H6"/><path d="m9.5 11.5-3.5 3.5 3.5 3.5"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.3-2.5 4"/><path d="M12 17.3v.2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol>
</svg>
<header id="top">
  <div id="topFiles" class="bar" role="toolbar" aria-label="Projekt und Dateien">
    <div class="brand"><strong>HTML-Schuleditor</strong><small id="version"></small></div>
    <span class="group">
      <button id="bProject" type="button" aria-label="Projektordner öffnen" title="Den Ordner wählen, in dem deine Seiten und Bilder liegen"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg><span>Projektordner öffnen</span></button>
      <button id="bNew" type="button" aria-label="Neue Seite" title="Eine neue Seite im Projektordner anlegen" disabled><svg class="ic" aria-hidden="true"><use href="#i-file-new"/></svg><span>Neue Seite</span></button>
      <button id="bOpen" type="button" aria-label="Seite öffnen …" title="Eine Seite mit dem Datei-Dialog öffnen"><svg class="ic" aria-hidden="true"><use href="#i-file-open"/></svg><span>Seite öffnen …</span></button>
    </span>
    <span class="group">
      <button id="bSave" type="button" aria-label="Speichern" class="primary" title="Speichern (Strg+S)" disabled><svg class="ic" aria-hidden="true"><use href="#i-save"/></svg><span>Speichern</span></button>
      <button id="bSaveAs" type="button" aria-label="Speichern unter …" title="Unter einem neuen Namen im Projektordner speichern" disabled><svg class="ic" aria-hidden="true"><use href="#i-save-as"/></svg><span>Speichern unter …</span></button>
    </span>
    <span class="group">
      <button id="bBrowser" type="button" aria-label="Im Browser ansehen" title="Die gespeicherte Seite im Browser ansehen" disabled><svg class="ic" aria-hidden="true"><use href="#i-browser"/></svg><span>Im Browser ansehen</span></button>
    </span>
    <div class="doc"><span id="docName"></span><span id="docState"></span><button id="bRescue" type="button" title="Den Text im Editor als neue Datei auf diesem Computer speichern, solange das Speichern hängt" hidden>Rettungskopie speichern</button></div>
    <span class="group">
      <button id="bHelp" type="button" aria-label="Hilfe" title="Kurzanleitung, Version und Lizenz (F1)"><svg class="ic" aria-hidden="true"><use href="#i-help"/></svg><span>Hilfe</span></button>
    </span>
  </div>
  <div id="topEdit" class="bar" role="toolbar" aria-label="Seite bearbeiten">
    <span class="group">
      <button id="bUndo" type="button" class="icon" title="Rückgängig (Strg+Z)" aria-label="Rückgängig" disabled><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg></button>
      <button id="bRedo" type="button" class="icon" title="Wiederholen (Strg+Y)" aria-label="Wiederholen" disabled><svg class="ic" aria-hidden="true"><use href="#i-redo"/></svg></button>
    </span>
    <span id="visualTools" class="off">
      <span class="group titleField"><label for="pageTitle">Seitentitel</label><input id="pageTitle" maxlength="250" type="text" autocomplete="off" placeholder="Seitentitel" title="Seitentitel: steht im Browser oben im Tab" disabled></span>
      <span id="visualCommands" role="group" aria-label="Seite gestalten">
        <span class="group">
          <button type="button" class="icon" data-edit="p" title="Absatz" aria-label="Absatz"><span class="gl p">¶</span></button>
          <button type="button" class="icon" data-edit="h1" title="Überschrift 1" aria-label="Überschrift 1"><span class="gl h1">H1</span></button>
          <button type="button" class="icon" data-edit="h2" title="Überschrift 2" aria-label="Überschrift 2"><span class="gl h2">H2</span></button>
          <button type="button" class="icon" data-edit="h3" title="Überschrift 3" aria-label="Überschrift 3"><span class="gl h3">H3</span></button>
        </span>
        <span class="group">
          <button type="button" class="icon" data-edit="bold" title="Fett (Strg+B)" aria-label="Fett"><span class="gl bold">B</span></button>
          <button type="button" class="icon" data-edit="italic" title="Kursiv (Strg+I)" aria-label="Kursiv"><span class="gl italic">I</span></button>
          <button type="button" class="icon" data-edit="underline" title="Unterstrichen (Strg+U)" aria-label="Unterstrichen"><span class="gl underline">U</span></button>
          <button type="button" class="icon" data-edit="sup" title="Hochgestellt" aria-label="Hochgestellt"><span class="gl sup">x²</span></button>
          <button type="button" class="icon" data-edit="sub" title="Tiefgestellt" aria-label="Tiefgestellt"><span class="gl sub">x₂</span></button>
          <button type="button" class="icon" data-edit="mark" title="Hervorheben" aria-label="Hervorheben"><span class="gl mark">ab</span></button>
          <button type="button" class="icon" data-edit="br" title="Neue Zeile im selben Absatz &lt;br&gt; (Umschalt+Enter)" aria-label="Zeilenumbruch"><svg class="ic" aria-hidden="true"><use href="#i-break"/></svg></button>
        </span>
        <span class="group">
          <button type="button" class="icon" data-edit="ul" title="Liste" aria-label="Liste"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg></button>
          <button type="button" class="icon" data-edit="ol" title="Nummerierte Liste" aria-label="Nummerierte Liste"><svg class="ic" aria-hidden="true"><use href="#i-numbers"/></svg></button>
        </span>
        <span class="group">
          <button type="button" class="icon" data-edit="link" title="Link einfügen" aria-label="Link einfügen"><svg class="ic" aria-hidden="true"><use href="#i-link"/></svg></button>
          <button type="button" class="icon" data-edit="unlink" title="Link entfernen" aria-label="Link entfernen"><svg class="ic" aria-hidden="true"><use href="#i-unlink"/></svg></button>
          <button type="button" class="icon" data-edit="table" title="Tabelle einfügen" aria-label="Tabelle einfügen"><svg class="ic" aria-hidden="true"><use href="#i-table"/></svg></button>
        </span>
        <span class="group">
          <button type="button" class="icon" data-edit="align-left" title="Linksbündig (noch einmal drücken nimmt es weg)" aria-label="Linksbündig"><svg class="ic" aria-hidden="true"><use href="#i-align-left"/></svg></button>
          <button type="button" class="icon" data-edit="align-center" title="Zentriert (noch einmal drücken nimmt es weg)" aria-label="Zentriert"><svg class="ic" aria-hidden="true"><use href="#i-align-center"/></svg></button>
          <button type="button" class="icon" data-edit="align-right" title="Rechtsbündig (noch einmal drücken nimmt es weg)" aria-label="Rechtsbündig"><svg class="ic" aria-hidden="true"><use href="#i-align-right"/></svg></button>
          <button type="button" class="icon" data-edit="align-justify" title="Blocksatz (noch einmal drücken nimmt es weg)" aria-label="Blocksatz"><svg class="ic" aria-hidden="true"><use href="#i-align-justify"/></svg></button>
        </span>
        <span class="group colorPick">
          <button id="bColor" type="button" class="icon" data-edit="color" title="Textfarbe" aria-label="Textfarbe"><span class="gl color">A</span><span id="colorBar"></span></button>
          <button id="bColorMenu" type="button" class="drop" title="Farbe auswählen" aria-label="Farbe auswählen" aria-haspopup="dialog" aria-expanded="false" aria-controls="palette">▾</button>
        </span>
      </span>
    </span>
    <span class="group">
      <button id="bPicture" type="button" class="insert" title="Ein Bild aus deinem Projektordner einfügen: in die Seite oder in den HTML-Code, je nachdem, wo du zuletzt geschrieben hast" disabled><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg><span>Bild einfügen</span></button>
    </span>
  </div>
</header>

<main id="work">
  <aside id="projectPane" aria-label="Projektordner">
    <div class="paneHead"><h2 id="projectName">Kein Projektordner</h2><button id="bFold" type="button" class="small" title="Liste einklappen" aria-expanded="true">«</button></div>
    <ul id="files" role="list"></ul>
  </aside>
  <section id="srcPane" aria-label="HTML-Code">
    <div class="paneHead"><h2>HTML-Code</h2><span class="hint" id="pos"></span><button id="bFind" type="button" class="small" title="Im Code suchen (Strg+F)" disabled><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span>Suchen</span></button></div>
    <div id="findBar" hidden>
      <input id="findText" type="search" autocomplete="off" spellcheck="false" aria-label="Suchen nach">
      <button id="bFindPrev" type="button" class="small" title="Vorheriger Treffer (Umschalt+Enter)" aria-label="Vorheriger Treffer">▲</button>
      <button id="bFindNext" type="button" class="small" title="Nächster Treffer (Enter)" aria-label="Nächster Treffer">▼</button>
      <span id="findCount" class="hint"></span>
      <button id="bFindClose" type="button" class="small" title="Suche schließen (Esc)" aria-label="Suche schließen">✕</button>
    </div>
    <div id="srcBox">
      <div id="gutter" aria-hidden="true"><div id="gutterIn"></div></div>
      <div id="marks" aria-hidden="true"><div id="marksIn"></div></div>
      <div id="hl" aria-hidden="true"><div id="hlIn"></div></div>
      <textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" aria-label="HTML-Code der Seite" readonly></textarea>
    </div>
  </section>
  <div id="split" role="separator" aria-orientation="vertical" title="Ziehen, um die Breite zu ändern"></div>
  <section id="pvPane" aria-label="Deine Seite">
    <div class="paneHead"><h2>Deine Seite</h2><span class="hint" id="visualHint"></span><button id="bPickTable" type="button" class="small" title="Die ganze Tabelle markieren. Mit Entf löschst du sie." hidden><svg class="ic" aria-hidden="true"><use href="#i-table"/></svg><span>Tabelle markieren</span></button></div>
    <div id="notes" hidden>
      <button id="bNotes" type="button" class="notesHead" aria-expanded="false"></button>
      <ul id="noteList" hidden></ul>
    </div>
    <div id="pvSlot">
      <iframe id="visualFrame" title="Deine Seite bearbeiten" src="edit-frame.html" sandbox="allow-same-origin" hidden></iframe>
      <div id="welcome">
        <p><strong>Öffne zuerst deinen Projektordner.</strong></p>
        <p>Das ist der Ordner, in dem deine Seiten und Bilder liegen.</p>
        <button id="bProject2" type="button" class="primary">Projektordner öffnen</button>
      </div>
    </div>
  </section>
</main>

<footer id="bottom"><span id="status" role="status"></span><span id="versionBottom"></span></footer>

<div id="palette" role="dialog" aria-label="Textfarbe auswählen" hidden></div>

<dialog id="dlg">
  <form method="dialog">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="buttons" id="dlgButtons"></div>
  </form>
</dialog>
</body>
</html>
